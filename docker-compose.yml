services:
  web:
    image: php:8.3-apache
    container_name: annaadhya-ebook
    ports:
      - "8080:80"
    volumes:
      - ./site:/var/www/html
      - ./docker/apache.conf:/etc/apache2/sites-available/000-default.conf:ro
    # WordPress needs write access to wp-content (SQLite DB + uploads).
    # chmod makes the bind mount writable for the container user on any host OS.
    command: >
      bash -c "chmod -R a+rwX /var/www/html/wp-content && exec apache2-foreground"
    restart: unless-stopped
